# LinkedIn Console: self-hosted LinkedIn team inbox.
# First run:  ./scripts/install.sh      (creates .env, builds images, starts everything)
# Update:     ./scripts/update.sh

name: linkedin-console

networks:
  default:
    name: linkedin-console
  # Account pods (browsers that load untrusted pages) live here: they reach Redis (their own restricted user)
  # and the internet, never the api, worker, pod-agent or database. Caddy joins to proxy Live View.
  pods:
    name: linkedin-console-pods

volumes:
  pgdata: {}
  redisdata: {}
  caddydata: {}
  caddyconfig: {}
  files:
    name: linkedin-console_files      # shared with account pods (uploads, media, live uploads)

x-server-env: &server-env
  DATABASE_URL: postgres://linkedin_console:${POSTGRES_PASSWORD}@postgres:5432/linkedin_console
  REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379
  FILES_DIR: /data/files
  POD_AGENT_URL: http://pod-agent:7070
  POD_AGENT_TOKEN: ${POD_AGENT_TOKEN}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  DEFAULT_GRANT: ${DEFAULT_GRANT:-NONE}
  DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-America/Chicago}
  DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en-US}
  DAILY_SEND_CAP: ${DAILY_SEND_CAP:-80}
  NEW_CHAT_CAP: ${NEW_CHAT_CAP:-20}
  SEND_RAMP: ${SEND_RAMP:-on}
  SEND_RAMP_START: ${SEND_RAMP_START:-20}
  SEND_RAMP_STEP: ${SEND_RAMP_STEP:-10}
  SMTP_URL: ${SMTP_URL:-}
  ALERT_FROM: ${ALERT_FROM:-}
  APP_URL: ${APP_URL:-}
  AI_PROVIDER: ${AI_PROVIDER:-}
  AI_MODEL: ${AI_MODEL:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@localhost}
  MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
  MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
  MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
  PASSWORD_SIGNIN: ${PASSWORD_SIGNIN:-on}
  TWILIO_CONSOLE_URL: ${TWILIO_CONSOLE_URL:-}
  TWILIO_CONSOLE_API_KEY: ${TWILIO_CONSOLE_API_KEY:-}
  STAFF_SYNC: ${STAFF_SYNC:-off}
  STAFF_SYNC_MINUTES: ${STAFF_SYNC_MINUTES:-5}
  STAFF_SOURCE: ${STAFF_SOURCE:-twilio}
  TWENTY_API_URL: ${TWENTY_API_URL:-}
  TWENTY_API_KEY: ${TWENTY_API_KEY:-}
  CRM_SYNC: ${CRM_SYNC:-off}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  init-perms:
    image: alpine:3.22
    command: ["sh", "-c", "mkdir -p /data/files/uploads /data/files/media /data/files/live && chown -R 1000:1000 /data/files"]
    volumes: [files:/data/files]
    restart: "no"

  postgres:
    image: postgres:17
    restart: unless-stopped
    # Sized for a few million messages on a 32 GB VM shared with the account browsers (override in .env).
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-4GB}
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - random_page_cost=1.1
    shm_size: 1g
    # The memory killer picks a browser before the database when the VM runs short.
    oom_score_adj: -500
    environment:
      POSTGRES_USER: linkedin_console
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: linkedin_console
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkedin_console"]
      interval: 5s
      retries: 20

  redis:
    image: valkey/valkey:8
    restart: unless-stopped
    command: ["sh", "-c", 'exec valkey-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    oom_score_adj: -500
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}     # so `docker compose exec redis valkey-cli` just works
    volumes: [redisdata:/data]
    networks: [default, pods]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 20

  api:
    build: { context: ., target: server }
    image: linkedin-console/server:latest
    restart: unless-stopped
    command: ["node", "src/api.ts"]
    environment: *server-env
    volumes: [files:/data/files]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      init-perms: { condition: service_completed_successfully }

  worker:
    image: linkedin-console/server:latest
    restart: unless-stopped
    command: ["node", "src/worker.ts"]
    environment:
      <<: *server-env
      SERVICE_NAME: worker
    # Healthy while its stream loops make progress (it also restarts itself if they stall for 3 minutes).
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(Date.now() - Number(require('fs').readFileSync('/tmp/worker-heartbeat', 'utf8')) < 120000 ? 0 : 1)"]
      interval: 30s
      start_period: 60s
      retries: 3
    volumes: [files:/data/files]
    depends_on:
      api: { condition: service_started }

  pod-agent:
    build: { context: ., target: pod-agent }
    image: linkedin-console/pod-agent:latest
    restart: unless-stopped
    environment:
      POD_AGENT_TOKEN: ${POD_AGENT_TOKEN}
      POD_NETWORK: linkedin-console-pods
      FILES_VOLUME: linkedin-console_files
      CHROME_IMAGE: linkedin-console/chrome:latest
      SIDECAR_IMAGE: linkedin-console/sidecar:latest
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379
      POD_MEMORY_MB: ${POD_MEMORY_MB:-1024}
      SIDECAR_ENV: ${SIDECAR_ENV:-}
      LIVE_SECRET: ${LIVE_SECRET}
      HEAL_PROVIDER: ${HEAL_PROVIDER:-}
      HEAL_MODEL: ${HEAL_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-}
      PARK_AFTER_MINUTES: ${PARK_AFTER_MINUTES:-10}
      SEND_MODE: ${SEND_MODE:-fast}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  caddy:
    build: { context: ., target: web }
    image: linkedin-console/caddy:latest
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      LIVE_SECRET: ${LIVE_SECRET}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    networks: [default, pods]
    volumes:
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      api: { condition: service_healthy }

  # Images used by account pods (built, never started by compose).
  chrome-image:
    build:
      context: ./apps/chrome
      args:
        CHROME_REFRESH: ${CHROME_REFRESH:-initial}
    image: linkedin-console/chrome:latest
    profiles: ["images"]

  sidecar-image:
    build: { context: ., target: sidecar }
    image: linkedin-console/sidecar:latest
    profiles: ["images"]
